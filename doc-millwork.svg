<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F5F2EC" />
  
  <!-- Outer Drawing Border -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#38342F" stroke-width="1.5" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#38342F" stroke-width="0.75" stroke-dasharray="4 2" opacity="0.5" />

  <!-- Section Title & Dimension Line Top -->
  <line x1="80" y1="75" x2="480" y2="75" stroke="#756F66" stroke-width="0.8" />
  <line x1="80" y1="70" x2="80" y2="80" stroke="#756F66" stroke-width="1" />
  <line x1="280" y1="70" x2="280" y2="80" stroke="#756F66" stroke-width="1" />
  <line x1="480" y1="70" x2="480" y2="80" stroke="#756F66" stroke-width="1" />
  <text x="180" y="68" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle">1,200 mm</text>
  <text x="380" y="68" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle">1,200 mm</text>

  <!-- Left Dimension Line (Height) -->
  <line x1="60" y1="100" x2="60" y2="470" stroke="#756F66" stroke-width="0.8" />
  <line x1="55" y1="100" x2="65" y2="100" stroke="#756F66" stroke-width="1" />
  <line x1="55" y1="280" x2="65" y2="280" stroke="#756F66" stroke-width="1" />
  <line x1="55" y1="360" x2="65" y2="360" stroke="#756F66" stroke-width="1" />
  <line x1="55" y1="470" x2="65" y2="470" stroke="#756F66" stroke-width="1" />
  <text x="50" y="190" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle" transform="rotate(-90 50 190)">1,100 mm (UPPER)</text>
  <text x="50" y="320" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle" transform="rotate(-90 50 320)">500 mm (SPLASH)</text>
  <text x="50" y="415" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle" transform="rotate(-90 50 415)">850 mm (BASE)</text>

  <!-- Cabinetry Elevation (Left Side) -->
  <!-- Upper Wall Cabinet -->
  <rect x="80" y="100" width="400" height="180" fill="#EFECE5" stroke="#23201D" stroke-width="2" />
  <!-- Upper Cabinet Doors -->
  <rect x="85" y="105" width="95" height="170" fill="#FAF9F6" stroke="#23201D" stroke-width="1.2" />
  <rect x="183" y="105" width="95" height="170" fill="#FAF9F6" stroke="#23201D" stroke-width="1.2" />
  <rect x="281" y="105" width="95" height="170" fill="#FAF9F6" stroke="#23201D" stroke-width="1.2" />
  <rect x="379" y="105" width="95" height="170" fill="#FAF9F6" stroke="#23201D" stroke-width="1.2" />
  <!-- Door swing dash lines (Upper) -->
  <polyline points="85,105 180,190 85,275" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 2" />
  <polyline points="278,105 183,190 278,275" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 2" />
  <polyline points="281,105 376,190 281,275" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 2" />
  <polyline points="474,105 379,190 474,275" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 2" />

  <!-- Backsplash Zone -->
  <rect x="80" y="280" width="400" height="80" fill="#EDEAE2" stroke="#23201D" stroke-width="1.2" />
  <!-- Tile Hatch / Fluting Pattern -->
  <line x1="120" y1="280" x2="120" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="160" y1="280" x2="160" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="200" y1="280" x2="200" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="240" y1="280" x2="240" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="280" y1="280" x2="280" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="320" y1="280" x2="320" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="360" y1="280" x2="360" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="400" y1="280" x2="400" y2="360" stroke="#DCD6CA" stroke-width="0.8" />
  <line x1="440" y1="280" x2="440" y2="360" stroke="#DCD6CA" stroke-width="0.8" />

  <!-- Countertop Slab -->
  <rect x="75" y="360" width="410" height="15" fill="#D5CFC5" stroke="#23201D" stroke-width="1.5" />

  <!-- Lower Base Cabinets -->
  <rect x="80" y="375" width="400" height="85" fill="#EFECE5" stroke="#23201D" stroke-width="2" />
  <!-- Drawers / Shaker Panels -->
  <rect x="85" y="380" width="190" height="36" fill="#FAF9F6" stroke="#23201D" stroke-width="1" />
  <rect x="85" y="420" width="190" height="36" fill="#FAF9F6" stroke="#23201D" stroke-width="1" />
  <rect x="283" y="380" width="190" height="76" fill="#FAF9F6" stroke="#23201D" stroke-width="1" />
  <!-- Pull Handles -->
  <line x1="160" y1="398" x2="200" y2="398" stroke="#9E5B19" stroke-width="2" />
  <line x1="160" y1="438" x2="200" y2="438" stroke="#9E5B19" stroke-width="2" />
  <line x1="300" y1="418" x2="300" y2="438" stroke="#9E5B19" stroke-width="2" />

  <!-- Toe Kick -->
  <rect x="90" y="460" width="380" height="15" fill="#38342F" stroke="#23201D" stroke-width="1" />

  <!-- Joinery Detail Section Callout (Right Side) -->
  <rect x="520" y="100" width="230" height="360" fill="#FAF9F6" stroke="#23201D" stroke-width="1.5" />
  <text x="635" y="120" font-family="sans-serif" font-size="9" font-weight="bold" fill="#23201D" text-anchor="middle">TYPICAL CORNICE &amp; SHADOWLINE DETAIL</text>

  <!-- Wall cleat & backing -->
  <rect x="535" y="140" width="20" height="300" fill="#E5E0D5" stroke="#23201D" stroke-width="1.2" />
  <!-- Upper carcass top panel with tongue & groove -->
  <polygon points="555,160 700,160 700,180 575,180 575,320 555,320" fill="#DFD9CE" stroke="#23201D" stroke-width="1.5" />
  
  <!-- Shadowline Reveal & LED Cove Profile -->
  <rect x="575" y="145" width="125" height="15" fill="#38342F" stroke="#23201D" stroke-width="1" />
  <circle cx="685" cy="152" r="3" fill="#9E5B19" />
  <text x="675" y="140" font-family="monospace" font-size="7" fill="#9E5B19">LED COVE</text>

  <!-- Door leaf with edge banding -->
  <rect x="580" y="185" width="18" height="130" fill="#F0ECE4" stroke="#23201D" stroke-width="1.2" />
  <line x1="580" y1="185" x2="580" y2="315" stroke="#9E5B19" stroke-width="2" />
  <!-- Concealed Blum Hinge graphic -->
  <path d="M575 220 C 565 220, 565 240, 580 240" fill="none" stroke="#756F66" stroke-width="1.5" />
  <circle cx="570" cy="230" r="2.5" fill="#23201D" />

  <!-- Adjustable Shelf & Pin -->
  <rect x="575" y="270" width="115" height="16" fill="#DFD9CE" stroke="#23201D" stroke-width="1" />
  <circle cx="578" cy="278" r="2" fill="#23201D" />
  <circle cx="680" cy="278" r="2" fill="#23201D" />

  <!-- Callout leader lines and notes -->
  <line x1="598" y1="200" x2="660" y2="215" stroke="#756F66" stroke-width="0.8" />
  <text x="665" y="218" font-family="sans-serif" font-size="7.5" fill="#756F66">18mm MDF / OAK VENEER</text>

  <line x1="590" y1="300" x2="660" y2="330" stroke="#756F66" stroke-width="0.8" />
  <text x="665" y="333" font-family="sans-serif" font-size="7.5" fill="#756F66">2mm ABS EDGE BAND</text>

  <line x1="555" y1="350" x2="660" y2="380" stroke="#756F66" stroke-width="0.8" />
  <text x="665" y="383" font-family="sans-serif" font-size="7.5" fill="#756F66">CONCEALED SOFT-CLOSE</text>

  <!-- Title Block Bottom Right -->
  <g transform="translate(520, 500)">
    <rect x="0" y="0" width="240" height="60" fill="#EDEAE2" stroke="#38342F" stroke-width="1" />
    <line x1="0" y1="20" x2="240" y2="20" stroke="#38342F" stroke-width="0.75" />
    <line x1="0" y1="40" x2="240" y2="40" stroke="#38342F" stroke-width="0.75" />
    <line x1="120" y1="20" x2="120" y2="60" stroke="#38342F" stroke-width="0.75" />
    
    <text x="10" y="14" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="0.05em" fill="#23201D">MILLWORK &amp; JOINERY DETAIL</text>
    <text x="10" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">SCALE: 1:20 / 1:5</text>
    <text x="130" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">DWG: MW-DET-01</text>
    <text x="10" y="53" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#9E5B19">C-DESIGN ARCHITECTURE</text>
  </g>
</svg>
