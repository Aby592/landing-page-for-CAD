<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F5F2EC" />
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#38342F" stroke-width="1.5" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#38342F" stroke-width="0.75" stroke-dasharray="4 2" opacity="0.5" />

  <!-- Road Frontage (South) -->
  <rect x="60" y="460" width="680" height="60" fill="#E5E0D5" stroke="#23201D" stroke-width="1.5" />
  <line x1="60" y1="490" x2="740" y2="490" stroke="#B5ADA2" stroke-width="1.5" stroke-dasharray="12 8" />
  <text x="400" y="485" font-family="sans-serif" font-size="8" font-weight="bold" fill="#756F66" letter-spacing="0.1em" text-anchor="middle">PRIMARY ACCESS ROAD (12.0M R.O.W.)</text>

  <!-- Property Boundary Line (Cadastral Boundary) -->
  <polygon points="120,80 660,80 660,460 120,460" fill="#EDE9DF" stroke="#23201D" stroke-width="2" stroke-dasharray="10 3 2 3" />
  
  <!-- Boundary Dimensions -->
  <text x="390" y="72" font-family="monospace" font-size="8.5" font-weight="bold" fill="#23201D" text-anchor="middle">54.00 m</text>
  <text x="110" y="270" font-family="monospace" font-size="8.5" font-weight="bold" fill="#23201D" text-anchor="middle" transform="rotate(-90 110 270)">38.00 m</text>
  <text x="670" y="270" font-family="monospace" font-size="8.5" font-weight="bold" fill="#23201D" text-anchor="middle" transform="rotate(90 670 270)">38.00 m</text>

  <!-- Topographic Contour Lines -->
  <path d="M120 140 Q 300 160 500 130 T 660 145" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 3" />
  <text x="630" y="135" font-family="monospace" font-size="7" fill="#756F66">102.50</text>
  
  <path d="M120 220 Q 280 240 480 210 T 660 225" fill="none" stroke="#B5ADA2" stroke-width="0.8" stroke-dasharray="3 3" />
  <text x="630" y="215" font-family="monospace" font-size="7" fill="#756F66">102.00</text>

  <!-- Building Footprint (Roof Plan View) -->
  <rect x="230" y="160" width="280" height="200" fill="#DCD6C9" stroke="#23201D" stroke-width="2.5" />
  <rect x="240" y="170" width="260" height="180" fill="#F0ECE4" stroke="#23201D" stroke-width="1.2" />
  
  <!-- Solar Panel Array -->
  <g fill="#2A2724" stroke="#FAF9F6" stroke-width="0.5">
    <rect x="260" y="185" width="30" height="40" />
    <rect x="295" y="185" width="30" height="40" />
    <rect x="330" y="185" width="30" height="40" />
    <rect x="260" y="235" width="30" height="40" />
    <rect x="295" y="235" width="30" height="40" />
    <rect x="330" y="235" width="30" height="40" />
  </g>

  <!-- Skylight -->
  <rect x="390" y="195" width="80" height="60" fill="rgba(255,255,255,0.85)" stroke="#23201D" stroke-width="1" />
  <line x1="390" y1="195" x2="470" y2="255" stroke="#756F66" stroke-width="0.8" />
  <line x1="390" y1="255" x2="470" y2="195" stroke="#756F66" stroke-width="0.8" />

  <!-- Swimming Pool & Deck -->
  <rect x="540" y="240" width="90" height="150" rx="6" fill="#D9E4E8" stroke="#23201D" stroke-width="1.5" />
  <rect x="550" y="250" width="70" height="130" rx="3" fill="#B8D2DC" stroke="#756F66" stroke-width="1" />
  <text x="585" y="320" font-family="sans-serif" font-size="8" font-weight="bold" fill="#356170" text-anchor="middle" transform="rotate(-90 585 320)">INFINITY POOL</text>

  <!-- Paved Driveway & Parking Court -->
  <polygon points="170,460 270,460 270,360 210,360 170,410" fill="#DFD9CE" stroke="#23201D" stroke-width="1.2" />
  <line x1="185" y1="460" x2="185" y2="410" stroke="#B5ADA2" stroke-width="0.8" />
  <line x1="205" y1="460" x2="205" y2="380" stroke="#B5ADA2" stroke-width="0.8" />
  <line x1="225" y1="460" x2="225" y2="360" stroke="#B5ADA2" stroke-width="0.8" />
  <line x1="245" y1="460" x2="245" y2="360" stroke="#B5ADA2" stroke-width="0.8" />

  <!-- Landscape Trees (Architectural Plan Symbols) -->
  <g stroke="#23201D" stroke-width="1" fill="#D2DEC8">
    <circle cx="170" cy="130" r="22" />
    <circle cx="170" cy="130" r="1.5" fill="#23201D" />
    <line x1="170" y1="115" x2="170" y2="145" stroke="#756F66" stroke-width="0.8" />
    <line x1="155" y1="130" x2="185" y2="130" stroke="#756F66" stroke-width="0.8" />

    <circle cx="215" cy="115" r="16" />
    <circle cx="215" cy="115" r="1.5" fill="#23201D" />

    <circle cx="580" cy="130" r="20" />
    <circle cx="580" cy="130" r="1.5" fill="#23201D" />

    <circle cx="620" cy="160" r="16" />
    <circle cx="620" cy="160" r="1.5" fill="#23201D" />

    <circle cx="160" cy="290" r="18" />
    <circle cx="160" cy="290" r="1.5" fill="#23201D" />
  </g>

  <!-- North Arrow Indicator -->
  <g transform="translate(700, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38342F" stroke-width="1" />
    <polygon points="0,-14 5,4 0,0" fill="#23201D" />
    <polygon points="0,-14 -5,4 0,0" fill="#756F66" />
    <text x="0" y="-18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#23201D" text-anchor="middle">N</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(540, 500)">
    <rect x="0" y="0" width="220" height="60" fill="#EDEAE2" stroke="#38342F" stroke-width="1" />
    <line x1="0" y1="20" x2="220" y2="20" stroke="#38342F" stroke-width="0.75" />
    <line x1="0" y1="40" x2="220" y2="40" stroke="#38342F" stroke-width="0.75" />
    <line x1="110" y1="20" x2="110" y2="60" stroke="#38342F" stroke-width="0.75" />
    
    <text x="10" y="14" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="0.05em" fill="#23201D">SITE MASTER PLAN</text>
    <text x="10" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">SCALE: 1:200</text>
    <text x="120" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">DWG: AR-SP-01</text>
    <text x="10" y="53" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#9E5B19">C-DESIGN ARCHITECTURE</text>
  </g>
</svg>
