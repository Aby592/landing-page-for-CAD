<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F5F2EC" />
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#38342F" stroke-width="1.5" />
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#38342F" stroke-width="0.75" stroke-dasharray="4 2" opacity="0.5" />

  <!-- Dimension Grid Lines Outer Top -->
  <line x1="120" y1="75" x2="680" y2="75" stroke="#756F66" stroke-width="0.8" />
  <line x1="120" y1="70" x2="120" y2="80" stroke="#756F66" stroke-width="1" />
  <line x1="380" y1="70" x2="380" y2="80" stroke="#756F66" stroke-width="1" />
  <line x1="680" y1="70" x2="680" y2="80" stroke="#756F66" stroke-width="1" />
  <text x="250" y="68" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle">7,200 mm</text>
  <text x="530" y="68" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle">8,400 mm</text>

  <!-- Left Dimension Line -->
  <line x1="75" y1="100" x2="75" y2="470" stroke="#756F66" stroke-width="0.8" />
  <line x1="70" y1="100" x2="80" y2="100" stroke="#756F66" stroke-width="1" />
  <line x1="70" y1="280" x2="80" y2="280" stroke="#756F66" stroke-width="1" />
  <line x1="70" y1="470" x2="80" y2="470" stroke="#756F66" stroke-width="1" />
  <text x="65" y="190" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle" transform="rotate(-90 65 190)">5,400 mm</text>
  <text x="65" y="380" font-family="monospace" font-size="8.5" fill="#756F66" text-anchor="middle" transform="rotate(-90 65 380)">4,800 mm</text>

  <!-- Outer Structural Walls (Bold architectural hatch) -->
  <polygon points="120,100 680,100 680,470 340,470 340,410 120,410" fill="#E8E4DA" stroke="#23201D" stroke-width="4.5" />
  <polygon points="127,107 673,107 673,463 347,463 347,403 127,403" fill="#F5F2EC" stroke="#23201D" stroke-width="1.2" />

  <!-- Interior Partitions -->
  <line x1="380" y1="107" x2="380" y2="403" stroke="#23201D" stroke-width="3" />
  <line x1="380" y1="260" x2="673" y2="260" stroke="#23201D" stroke-width="3" />
  <line x1="230" y1="250" x2="230" y2="403" stroke="#23201D" stroke-width="3" />

  <!-- Door Openings & Swings (Quarter Circles) -->
  <!-- Main Entry Door -->
  <line x1="170" y1="403" x2="205" y2="368" stroke="#23201D" stroke-width="1.5" />
  <path d="M170 403 A 35 35 0 0 0 205 368" fill="none" stroke="#9E5B19" stroke-width="1" stroke-dasharray="2 2" />
  
  <!-- Master Bed Door -->
  <line x1="380" y1="170" x2="415" y2="135" stroke="#23201D" stroke-width="1.5" />
  <path d="M380 170 A 35 35 0 0 0 415 135" fill="none" stroke="#9E5B19" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Bathroom Door -->
  <line x1="430" y1="260" x2="465" y2="225" stroke="#23201D" stroke-width="1.5" />
  <path d="M430 260 A 35 35 0 0 0 465 225" fill="none" stroke="#9E5B19" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Glazing / Sliding Balcony Doors -->
  <rect x="150" y="102" width="180" height="8" fill="#FAF9F6" stroke="#23201D" stroke-width="1" />
  <line x1="240" y1="102" x2="240" y2="110" stroke="#23201D" stroke-width="1" />
  <rect x="674" y="130" width="8" height="100" fill="#FAF9F6" stroke="#23201D" stroke-width="1" />

  <!-- Furniture Outlines (Architectural CAD symbols) -->
  <!-- Master Bed & Pillows -->
  <rect x="510" y="125" width="120" height="95" fill="#E8E4DA" stroke="#23201D" stroke-width="1" />
  <rect x="525" y="130" width="38" height="22" rx="3" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <rect x="575" y="130" width="38" height="22" rx="3" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <line x1="510" y1="160" x2="630" y2="160" stroke="#B5ADA2" stroke-width="0.8" />
  <rect x="485" y="135" width="20" height="20" fill="#DDD7CB" stroke="#756F66" stroke-width="0.8" />
  <rect x="635" y="135" width="20" height="20" fill="#DDD7CB" stroke="#756F66" stroke-width="0.8" />

  <!-- Living Room Sectional Sofa & Coffee Table -->
  <rect x="145" y="130" width="140" height="48" rx="4" fill="#E8E4DA" stroke="#23201D" stroke-width="1" />
  <rect x="145" y="178" width="48" height="60" rx="4" fill="#E8E4DA" stroke="#23201D" stroke-width="1" />
  <rect x="210" y="195" width="70" height="40" rx="2" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />

  <!-- Dining Table with 6 Chairs -->
  <rect x="250" y="285" width="90" height="55" rx="4" fill="#E8E4DA" stroke="#23201D" stroke-width="1" />
  <circle cx="270" cy="273" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <circle cx="295" cy="273" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <circle cx="320" cy="273" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <circle cx="270" cy="352" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <circle cx="295" cy="352" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />
  <circle cx="320" cy="352" r="6" fill="#FAF9F6" stroke="#756F66" stroke-width="0.8" />

  <!-- Room Text Labels -->
  <text x="215" y="255" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#23201D">LIVING &amp; DINING</text>
  <text x="215" y="267" font-family="monospace" font-size="7.5" fill="#756F66">38.5 m²</text>

  <text x="545" y="240" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#23201D">MASTER SUITE</text>
  <text x="545" y="252" font-family="monospace" font-size="7.5" fill="#756F66">24.2 m²</text>

  <text x="490" y="335" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#23201D">EN-SUITE BATH</text>
  <text x="490" y="347" font-family="monospace" font-size="7.5" fill="#756F66">9.8 m²</text>

  <!-- North Arrow Graphic -->
  <g transform="translate(710, 75)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38342F" stroke-width="1" />
    <polygon points="0,-14 5,4 0,0" fill="#23201D" />
    <polygon points="0,-14 -5,4 0,0" fill="#756F66" />
    <text x="0" y="-18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#23201D" text-anchor="middle">N</text>
  </g>

  <!-- Title Block Bottom Right -->
  <g transform="translate(540, 500)">
    <rect x="0" y="0" width="220" height="60" fill="#EDEAE2" stroke="#38342F" stroke-width="1" />
    <line x1="0" y1="20" x2="220" y2="20" stroke="#38342F" stroke-width="0.75" />
    <line x1="0" y1="40" x2="220" y2="40" stroke="#38342F" stroke-width="0.75" />
    <line x1="110" y1="20" x2="110" y2="60" stroke="#38342F" stroke-width="0.75" />
    
    <text x="10" y="14" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="0.05em" fill="#23201D">CAD CONVERSION</text>
    <text x="10" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">SCALE: 1:100</text>
    <text x="120" y="33" font-family="sans-serif" font-size="7.5" fill="#756F66">DWG: CAD-CONV-01</text>
    <text x="10" y="53" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#9E5B19">C-DESIGN ARCHITECTURE</text>
  </g>
</svg>
